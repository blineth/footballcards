name: Fix radar provider copy

on:
  push:
    paths:
      - '.github/workflows/fix-radar-copy.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct live provider copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text(encoding='utf-8')
          old = 'The app checks SofaScore every minute; once both official XIs appear, the fixture turns green and the ranking switches to confirmed starters only.'
          new = 'The app checks ESPN every minute; once both official XIs appear, the fixture turns green and the ranking switches to confirmed starters only.'
          if old not in s:
              raise SystemExit('Expected dashboard copy not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "Use ESPN wording in live lineup UI"
          git push
