name: ChatGPT Artifact Transfer
on:
  push:
    branches:
      - chatgpt-download-iwill-20261014
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble Hostinger deployment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build/dist/assets build/dist/fonts build/dist/images

          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          import re

          base = "https://assessment.itrust121.com"
          root = Path("build/dist")

          def get(url):
              req = Request(url, headers={"User-Agent":"Mozilla/5.0"})
              with urlopen(req, timeout=30) as r:
                  return r.read()

          def save(rel, required=True):
              rel = rel if rel.startswith("/") else "/" + rel
              target = root / rel.lstrip("/")
              target.parent.mkdir(parents=True, exist_ok=True)
              try:
                  data = get(base + rel)
                  target.write_bytes(data)
                  print("downloaded", rel, len(data))
                  return data
              except HTTPError as e:
                  if required:
                      raise
                  print("optional resource unavailable", rel, e.code)
                  return b""

          html = save("/iwill").decode("utf-8")
          (root / "index.html").write_text(html)

          queue = set(re.findall(r'(?:src|href)=["\'](/assets/[^"\']+)["\']', html))
          seen = set()
          while queue:
              rel = queue.pop()
              if rel in seen:
                  continue
              seen.add(rel)
              data = save(rel)
              if rel.endswith(".js"):
                  text = data.decode("utf-8", "ignore")
                  for match in re.findall(r'(?<![A-Za-z0-9_])(?:/)?assets/[A-Za-z0-9_.-]+\.js', text):
                      child = "/" + match.lstrip("/")
                      if child not in seen:
                          queue.add(child)

          for rel in [
              "/fonts/PPMonumentExtended-Light.woff2",
              "/fonts/PPMonumentExtended-Regular.woff2",
              "/fonts/PPMonumentExtended-Black.woff2",
              "/images/hero-couple.png",
              "/images/hero-family.png",
              "/cookie.svg",
              "/logo-black.png",
              "/logo.png"
          ]:
              save(rel, required=False)

          # White logo is optional; the Will form/PDF uses the supplied black logo.
          save("/logo-white.png", required=False)
          PY

          cp chatgpt-build/iwill-enhancements.js build/dist/iwill-enhancements.js
          cp chatgpt-build/server.js build/server.js
          cp chatgpt-build/build-check.js build/build-check.js
          cp chatgpt-build/package.json build/package.json
          cp chatgpt-build/IWILL-DEPLOYMENT-README.txt build/IWILL-DEPLOYMENT-README.txt

          python3 - <<'PY'
          from pathlib import Path
          p = Path("build/dist/index.html")
          html = p.read_text()
          tag = '  <script src="/iwill-enhancements.js" defer></script>\n'
          if "iwill-enhancements.js" not in html:
              html = html.replace("</body>", tag + "</body>")
          p.write_text(html)
          PY

          cd build
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm run build
          node --check server.js
          node --check dist/iwill-enhancements.js
          test -f dist/logo-black.png
          test -f dist/index.html

      - name: Upload Hostinger-ready ZIP
        uses: actions/upload-artifact@v4
        with:
          name: iTrustLaw_Assessment_iWill_PEOPLE_REUSE_2026-10-14
          path: build/
          if-no-files-found: error
          compression-level: 6
