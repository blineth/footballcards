name: Refresh 2026-27 current-season research

on:
  workflow_dispatch:
  schedule:
    - cron: "35 5 * * *"
  push:
    paths:
      - "scripts/backfill-current-season-espn.py"
      - "scripts/backfill-current-season-fbref.py"
      - "lib/db/schema.ts"
      - "lib/db/ensure-research-schema.ts"
      - "app/api/admin/import/route.ts"
      - "app/api/admin/sync-international-espn/route.ts"
      - "app/api/international/players/route.ts"
      - "app/api/version/route.ts"
      - ".github/workflows/refresh-current-season.yml"

permissions:
  contents: write

concurrency:
  group: refresh-current-season
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Scrape current-season match stats to repository snapshot
        run: python scripts/backfill-current-season-espn.py

      - name: Check whether production can accept database sync
        id: live_check
        shell: bash
        run: |
          BODY="$(curl -fsS https://footballcards-wheat.vercel.app/api/version || true)"
          echo "$BODY"
          if echo "$BODY" | grep -q "$GITHUB_SHA"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Production is on $GITHUB_SHA; Neon/international sync can run."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Production is not on this commit; keeping the refreshed repository snapshot and skipping live sync."
          fi

      - name: Sync refreshed current-season snapshot to Neon
        if: steps.live_check.outputs.ready == 'true'
        env:
          SYNC_URL: https://footballcards-wheat.vercel.app
        run: python scripts/backfill-current-season-espn.py --sync-only

      - name: Refresh international match history and linked player profiles
        if: steps.live_check.outputs.ready == 'true'
        env:
          SYNC_URL: https://footballcards-wheat.vercel.app
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path

          import requests

          base = os.environ["SYNC_URL"].rstrip("/")
          offset = 0
          total = None
          processed = 0

          for _ in range(250):
              response = requests.get(
                  f"{base}/api/admin/sync-international-espn",
                  params={"offset": offset, "limit": 8},
                  timeout=120,
              )
              print("International sync:", response.status_code, response.text[:800], flush=True)
              response.raise_for_status()
              payload = response.json()
              total = payload.get("totalFixtures", total)
              processed += int(payload.get("processedFixtures") or 0)
              if payload.get("done"):
                  break
              next_offset = int(payload.get("nextOffset") or offset)
              if next_offset <= offset:
                  raise RuntimeError(f"International sync made no progress at offset {offset}")
              offset = next_offset
              time.sleep(0.25)
          else:
              raise RuntimeError("International sync exceeded the chunk safety limit")

          response = requests.get(f"{base}/api/international/players", timeout=120)
          print("International profiles:", response.status_code, response.text[:800], flush=True)
          response.raise_for_status()
          profiles = response.json()

          out = Path("data/international")
          out.mkdir(parents=True, exist_ok=True)
          (out / "player_profiles.json").write_text(
              json.dumps(profiles, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          if int(profiles.get("playerCount") or 0) <= 0:
              raise RuntimeError("No international player profiles were produced")
          coverage = profiles.get("domesticCoverage") or {}
          if int(coverage.get("current") or 0) <= 0:
              raise RuntimeError(f"No current domestic links were produced: {coverage}")

          print(
              json.dumps(
                  {
                      "internationalFixtures": total,
                      "processed": processed,
                      "playerCount": profiles.get("playerCount"),
                      "domesticCoverage": coverage,
                  },
                  indent=2,
              ),
              flush=True,
          )
          PY

      - name: Validate current-season dataset
        shell: bash
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root = Path("data/current-season")
          h2h = list(csv.DictReader((root / "h2h.csv").open(encoding="utf-8")))
          baselines = list(csv.DictReader((root / "player_baselines.csv").open(encoding="utf-8")))
          report = json.load((root / "quality-report.json").open(encoding="utf-8"))

          assert len(h2h) >= 500, len(h2h)
          assert len(baselines) >= 150, len(baselines)
          competitions = {r.get("competition") for r in baselines}
          league_two = [r for r in baselines if r.get("competition") == "League Two"]
          assert "League Two" in competitions, competitions
          assert len(league_two) >= 200, len(league_two)
          assert len(competitions) >= 10, competitions
          assert sum(int(r.get("shots_on_target") or 0) for r in h2h) > 0
          assert sum(int(r.get("fouls_committed") or 0) for r in h2h) > 0
          assert sum(1 for r in h2h if str(r.get("yellow_card")).lower() in {"true", "1"}) > 0
          assert report["totals"]["shots_on_target"] > 0
          international = json.load((Path("data/international") / "player_profiles.json").open(encoding="utf-8"))
          assert int(international.get("playerCount") or 0) > 0
          assert int((international.get("domesticCoverage") or {}).get("current") or 0) > 0
          print("Validation passed:", report["totals"])
          print("Neon sync:", report.get("neon_sync", "skipped until production catches up"))
          print("International linked profiles:", international.get("playerCount"), international.get("domesticCoverage"))
          PY

      - name: Commit refreshed research snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current-season/h2h.csv data/current-season/player_baselines.csv data/current-season/quality-report.json data/league-two/player_baselines.csv data/league-two/player_baselines_2025_26_current_players.csv data/international/player_profiles.json
          if git diff --cached --quiet; then
            echo "Current-season research snapshot already up to date."
            exit 0
          fi
          git commit -m "Refresh 2026-27 current-season research data"
          git pull --rebase origin main
          git push origin main
