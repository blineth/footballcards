name: Apply lineup status UI

on:
  push:
    branches:
      - ui-fixture-dropdowns
    paths:
      - 'scripts/add-lineup-status.py'
      - '.github/workflows/apply-lineup-status.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-fixture-dropdowns
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply lineup status UI
        run: python scripts/add-lineup-status.py
      - name: Commit page update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          if git diff --cached --quiet; then
            echo 'No page changes needed.'
            exit 0
          fi
          git commit -m "Add fixture lineup confirmation status"
          git push origin ui-fixture-dropdowns
