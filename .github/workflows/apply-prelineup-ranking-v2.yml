name: Apply pre-lineup ranking v2

on:
  push:
    branches:
      - ui-fixture-dropdowns
    paths:
      - 'scripts/apply-prelineup-ranking-v2.mjs'
      - '.github/workflows/apply-prelineup-ranking-v2.yml'

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-fixture-dropdowns
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply ranking v2
        run: node scripts/apply-prelineup-ranking-v2.mjs
      - name: Install dependencies
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Verify production build
        run: pnpm run build
      - name: Commit tested page change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          if git diff --cached --quiet; then
            echo 'No ranking changes to commit.'
            exit 0
          fi
          git commit -m "Apply start-risk adjusted pre-lineup ranking"
          git push origin ui-fixture-dropdowns
