name: Fix player name matching

on:
  push:
    paths:
      - '.github/workflows/fix-player-matching.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove initial-only surname matching
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/api/fixture-radar-espn/route.ts')
          s = p.read_text(encoding='utf-8')
          old = '''  if (aa[0] === bb[0] && aa.at(-1) === bb.at(-1)) return 90\n  if (aa.at(-1) === bb.at(-1) && aa[0]?.[0] === bb[0]?.[0]) return 80\n  return 0'''
          new = '''  if (aa[0] === bb[0] && aa.at(-1) === bb.at(-1)) return 90\n  return 0'''
          if old not in s:
              raise SystemExit('Expected matcher block not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/fixture-radar-espn/route.ts
          git commit -m "Tighten current-to-historical player matching"
          git push
