name: Build model calibration

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/calibrate-model.yml"

permissions:
  contents: write

concurrency:
  group: model-calibration
  cancel-in-progress: true

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build walk-forward calibration snapshot
        run: python scripts/build-model-calibration.py

      - name: Validate calibration output
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("data/model/calibration.json")
          data = json.loads(p.read_text(encoding="utf-8"))

          assert data["version"] == "walk-forward-v2"
          assert int(data["rowsRead"]) > 1000
          assert int(data["walkForwardPredictions"]) > 1000
          assert len(data["competitions"]) >= 10

          for market in ["card", "foul1", "foul2", "foul3", "fouled1", "shot1", "shot2", "sot1", "sot2"]:
              m = data["global"][market]
              assert int(m["sample"]) > 100
              assert len(m["bands"]) == 20
              probs = [float(b["calibratedProbability"]) for b in m["bands"]]
              assert all(0 < x < 1 for x in probs)
              assert all(a <= b for a, b in zip(probs, probs[1:]))

          print("Calibration validation passed")
          print("Walk-forward predictions:", data["walkForwardPredictions"])
          print("Competitions:", len(data["competitions"]))
          PY

      - name: Commit calibration snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/model/calibration.json
          if git diff --cached --quiet; then
            echo "Calibration snapshot already up to date."
            exit 0
          fi
          git commit -m "Refresh walk-forward model calibration"
          git pull --rebase origin main
          git push origin main
